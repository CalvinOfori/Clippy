<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="emeraldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="accentBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Upper arm of the C: a thick angular ribbon sweeping from the
       top-right gap around to the left side. Built as a single closed
       polygon (not an arc-stroke), giving it a faceted, origami feel
       distinct from the source image's diamond-tile construction. -->
  <path d="M 340 120
           L 420 165
           L 300 235
           L 256 210
           L 175 255
           L 175 190
           L 256 145
           Z"
        fill="url(#emeraldLight)"/>

  <!-- Lower arm of the C: mirrored ribbon sweeping from the bottom-right
       gap around to the left side, in the darker tone for the two-tone
       contrast. -->
  <path d="M 340 392
           L 420 347
           L 300 277
           L 256 302
           L 175 257
           L 175 322
           L 256 367
           Z"
        fill="url(#emeraldDark)"/>

  <!-- The connecting spine on the left where both arms meet, filled
       solid to read as one continuous letterform rather than two
       separate floating pieces. -->
  <path d="M 175 190 L 256 145 L 256 210 L 175 255 Z" fill="url(#emeraldLight)"/>
  <path d="M 175 322 L 256 367 L 256 302 L 175 257 Z" fill="url(#emeraldDark)"/>

  <!-- Single bright accent facet sitting in the mouth of the C, echoing
       a play-button / cut-point motif (nod to video editing) rather
       than the source's diamond chip — a small rounded triangle. -->
  <path d="M 330 230 L 400 256 L 330 282 Z"
        fill="url(#accentBright)"/>
</svg>
